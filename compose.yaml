# Identificador estável da infraestrutura local; preserva os volumes existentes após renomear o diretório.
name: spt-saas
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spt
      POSTGRES_PASSWORD: spt_local
      POSTGRES_DB: spt
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["spt_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spt -d spt"]
      interval: 2s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Configure S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Configure S3_SECRET_ACCESS_KEY in .env}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["spt_objects:/data"]
volumes:
  spt_objects:
  spt_data:
