name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spt
          POSTGRES_PASSWORD: spt_local
          POSTGRES_DB: spt
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U spt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://spt_runtime:spt_runtime_local@localhost:5432/spt?schema=public
      WORKER_DATABASE_URL: postgresql://spt_worker:spt_worker_ci_local@localhost:5432/spt?schema=public
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_REGION: us-east-1
      S3_BUCKET: spt-ci-private
      S3_ACCESS_KEY_ID: spt-ci-local
      S3_SECRET_ACCESS_KEY: spt-ci-local-only-storage
      MIGRATION_DATABASE_URL: postgresql://spt:spt_local@localhost:5432/spt?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node -e "console.log('JWT_SECRET=' + require('crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
      - run: node -e "console.log('MFA_ENCRYPTION_KEY=' + require('crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      # Migrations grant privileges to this role before table provisioning runs.
      - name: Create restricted runtime role before migrations
        env:
          PGPASSWORD: spt_local
        run: >-
          psql -h localhost -U spt -d spt -v ON_ERROR_STOP=1
          -c "CREATE ROLE spt_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
      - run: npm run db:migrate
      - run: npm run db:setup:local
      - run: npm run worker:setup:local
      # Build the official source: historical public container images were removed.
      - uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          path: .ci-minio
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.8
          cache: false
      - name: Build test storage from pinned official source
        working-directory: .ci-minio
        run: go build -o "$RUNNER_TEMP/minio" .
      - name: Start isolated test storage
        run: |
          MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:59000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:59000/minio/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - run: npm run storage:setup:local
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:browser
      - run: npm audit --audit-level=high
