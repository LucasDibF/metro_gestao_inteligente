server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 9m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
 # No TLS here: this listener is plain HTTP on loopback. HSTS (max-age, includeSubDomains) belongs
 # to the external reverse proxy that terminates TLS in front of 127.0.0.1:8080.
 location /api/ { proxy_pass http://api:3000; proxy_read_timeout 90s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
 location / { try_files $uri $uri/ /index.html; }
}
